# Configuration for `cargo deny`. Run with `cargo deny check`.

[graph]
all-features = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl" },
]

[licenses]
# Strata is GPL-3.0-or-later; every dependency has to be compatible with that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    # Permissive, GPL-compatible, and present in the lock file today.
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"